name: bitibridge_wallet
description: Carteira Liquid não-custodial da BitiBridge. A seed nasce e morre no aparelho do usuário.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # SHA-256 do checksum do BIP39. Pacote do próprio time do Dart.
  # A versão é FIXA (sem ^) de propósito: build reproduzível é o que permite ao
  # usuário conferir que o app instalado corresponde a este código.
  crypto: 3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0

# NOTA: `lwk` (Liquid Wallet Kit) entra na próxima etapa, quando a carteira passar
# a falar com a rede. O módulo de seed é DE PROPÓSITO livre de dependências além
# do SHA-256: quanto menos código de terceiro nessa parte, mais fácil auditar.

flutter:
  uses-material-design: true
