name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Verificação de tipos
        run: npm run typecheck

      - name: Testes (inclui os vetores oficiais do BIP39)
        run: npm test

      - name: A seed nunca pode aparecer em log
        run: |
          # Trava de repositório: nada no caminho da seed pode ir para console,
          # analytics ou rede. Falha o CI antes de virar vazamento.
          if grep -rnEi "(console\.[a-z]+|fetch|sendBeacon|XMLHttpRequest)\(.*(mnemonic|seed|entropy|privateKey|xprv)" src/; then
            echo "::error::Possível vazamento de seed"
            exit 1
          fi
          echo "OK — nenhum log ou envio de material secreto"

      - name: Gerador previsível é proibido no caminho da seed
        run: |
          if grep -rn "Math.random" src/lib/seed/ src/lib/vault/; then
            echo "::error::Math.random no caminho da seed"
            exit 1
          fi
          echo "OK — só o gerador criptográfico do navegador"

      - run: npm run build

      - name: Impressão digital desta versão
        run: |
          # Publica o hash de cada arquivo servido. Quem quiser conferir se o que
          # wallet.bitibridge.com entregou é o que este repositório compilou pode
          # comparar com esta lista.
          {
            echo "### Impressão digital da build"
            echo ""
            echo "Commit: \`${GITHUB_SHA}\`"
            echo ""
            echo '```'
            find dist -type f | sort | xargs sha256sum
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: wallet-dist
          path: dist
          retention-days: 30
