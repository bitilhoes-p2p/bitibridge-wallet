name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Análise e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes (inclui os vetores oficiais do BIP39)
        run: flutter test

      - name: A seed nunca pode aparecer em log
        run: |
          # Trava de repositório: nenhum print/log pode receber seed, mnemônico,
          # entropia ou chave privada. Falha o CI antes de virar vazamento.
          if grep -rnEi "(print|debugPrint|log)\s*\(.*(mnemonic|seed|entropy|privateKey|xprv)" lib/; then
            echo "::error::Possível vazamento de seed em log"
            exit 1
          fi
          echo "OK — nenhum log de material secreto"

  apk:
    name: APK de teste
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      # ATENÇÃO: build de TESTE, assinado com a chave de depuração do Flutter.
      # A versão de distribuição vai precisar de uma chave própria, guardada em
      # secret do repositório — nunca em arquivo versionado.
      - name: Gerar APK
        run: flutter build apk --release

      - name: Hash do APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          SHA=$(sha256sum "$APK" | cut -d" " -f1)
          echo "SHA-256: $SHA"
          {
            echo "### APK de teste"
            echo ""
            echo "Commit: \`${GITHUB_SHA}\`"
            echo ""
            echo "SHA-256: \`$SHA\`"
            echo ""
            echo "Confira com: \`sha256sum app-release.apk\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: bitibridge-wallet-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
