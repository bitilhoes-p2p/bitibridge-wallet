server {
    listen 80;
    server_name _;

    # Atrás do proxy do EasyPanel/Traefik: força HTTPS.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/wasm image/svg+xml;

    # ── Política de segurança de conteúdo ────────────────────────────────────
    #
    # É a trava mais forte desta aplicação, e ela é MAIS FECHADA que a do site
    # principal de propósito: aqui mora a seed do usuário.
    #
    #   default-src 'none'   nada é permitido por padrão; tudo é liberado item a item
    #   script-src  'self'   só o nosso JavaScript, e NADA em linha (o build do Vite
    #                        não gera script inline — foi conferido) — é isto que
    #                        impede um script injetado de rodar e ler a seed
    #   style-src   'self'   idem para estilo; por isso não existe `style=` no JSX
    #   script-src           além do nosso JavaScript, 'wasm-unsafe-eval' — exigido
    #                        para instanciar o WebAssembly da Liquid Wallet Kit.
    #                        NÃO é o 'unsafe-eval' comum: não libera eval() de texto,
    #                        só a compilação de módulos WebAssembly
    #   connect-src          'self' mais o indexador da rede Liquid, NOMINALMENTE.
    #                        Nenhum outro destino é alcançável a partir desta página.
    #                        Ao trocar para o indexador próprio, é AQUI que entra o
    #                        novo endereço — e o antigo deve sair
    #   frame-ancestors      'none' impede que a carteira seja embutida em iframe de
    #                        outro site, que é o golpe clássico de clickjacking
    #   form-action 'none'   não existe formulário que envie dados para lugar nenhum
    #
    set $wallet_csp "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://blockstream.info; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests";

    # Assets com hash no nome: cache longo e imutável.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Content-Security-Policy $wallet_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # index.html nunca em cache: é o que aponta para a versão mais recente.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Content-Security-Policy $wallet_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Content-Security-Policy $wallet_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }
}
